name: KoPOS ERP Connector CI

on:
  push:
    paths:
      - "kopos_connector/**"
      - "tests/**"
      - "AGENTS.md"
      - "requirements.txt"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/connector-ci.yml"
  pull_request:
    paths:
      - "kopos_connector/**"
      - "tests/**"
      - "AGENTS.md"
      - "requirements.txt"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/connector-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-connector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact connector commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2" "setuptools==83.0.0" "wheel==0.46.2"
          python -m pip install \
            "build==1.3.0" \
            "pytest==9.0.3" \
            "pycryptodome==3.23.0" \
            "jsonschema==4.24.0" \
            "pip-audit==2.10.1"

      - name: Audit production dependencies and generate CycloneDX SBOM
        run: python -m pip_audit . --format cyclonedx-json --output "$RUNNER_TEMP/kopos-connector.cdx.json"

      - name: Compile all connector and test sources
        run: python -m compileall -q kopos_connector tests

      - name: Build connector wheel for packaging identity
        run: |
          python -m build \
            --wheel \
            --no-isolation \
            --outdir "$RUNNER_TEMP/kopos-connector-wheel"
          python - <<'PY'
          import os
          from pathlib import Path

          artifacts = sorted(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("kopos-connector-wheel")
              .glob("*.whl")
          )
          if len(artifacts) != 1:
              raise SystemExit(
                  f"expected exactly one ERP connector wheel, found {len(artifacts)}"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print(f"KOPOS_CONNECTOR_WHEEL={artifacts[0]}", file=output)
          PY

      - name: Run mocked-unit connector contract suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q -m "not inventory_regression" \
            tests \
            kopos_connector/tests \
            tests/test_release_methodology_contract.py \
            kopos_connector/kopos/tests/test_sales_invoice_service.py \
            kopos_connector/kopos/tests/test_maybank_qr_sales_invoice_flow.py

      - name: Record identity-bound source-test evidence
        env:
          KOPOS_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          source_commit = os.environ["KOPOS_SOURCE_COMMIT"]
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("source commit is not an immutable lowercase SHA")
          wheel = Path(os.environ["KOPOS_CONNECTOR_WHEEL"])
          wheel_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
          evidence = {
              "schemaVersion": 1,
              "status": "passed",
              "evidenceLevel": "mocked_unit",
              "testedInput": "source_checkout",
              "sourceCommit": source_commit,
              "wheelFile": wheel.name,
              "wheelSha256": wheel_sha256,
              "wheelTested": False,
              "artifactScope": "packaging_identity_only",
              "suite": "mocked_connector_contract",
              "recordedAt": datetime.now(timezone.utc).isoformat().replace(
                  "+00:00", "Z"
              ),
              "productionAcceptance": False,
              "requiredNextGate": "real_frappe_mariadb_redis",
          }
          evidence_path = Path(os.environ["RUNNER_TEMP"]) / "connector-test-evidence.json"
          evidence_path.write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          persisted = json.loads(evidence_path.read_text(encoding="utf-8"))
          if persisted != evidence:
              raise SystemExit("connector evidence did not round-trip exactly")
          PY

      - name: Reject generated or secret-bearing changes
        run: |
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            git status --short
            echo "Connector tests modified the release source." >&2
            exit 1
          fi

      - name: Upload source-contract and packaging evidence
        uses: actions/upload-artifact@v7
        with:
          name: kopos-erp-connector-source-contract-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kopos-connector.cdx.json
            ${{ runner.temp }}/connector-test-evidence.json
            ${{ runner.temp }}/kopos-connector-wheel/*.whl
