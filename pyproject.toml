[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kopos_connector"
description = "ERPNext v16 connector for KoPOS mobile POS"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "KoPOS", email = "support@kopos.my" }]
license = "GPL-3.0-only"
keywords = ["erpnext", "frappe", "offline-first", "point-of-sale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Frappe",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "pycryptodome>=3.20.0",
    "jsonschema>=4.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/victorlee115/kopos_connector"
Repository = "https://github.com/victorlee115/kopos_connector"

[tool.setuptools.dynamic]
version = { attr = "kopos_connector.__version__" }

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.pytest.ini_options]
markers = [
    "inventory_regression: optional recipe, modifier-authoring, stock, COGS, or inventory regression outside commercial release acceptance",
]
